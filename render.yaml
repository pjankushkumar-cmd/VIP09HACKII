services:
  - type: web
    name: hackii-panel
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: hackii-panel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET
        sync: false
